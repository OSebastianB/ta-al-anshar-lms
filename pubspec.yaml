name: al_anshar_lms
description: "Aplikasi LMS Android SD Islam Al-Anshar Kota Bekasi (Flutter)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo-al-anshar.jpg

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-semibold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-extrabold.ttf
          weight: 800
